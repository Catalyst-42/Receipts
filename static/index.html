<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Receipts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/styles.css">
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "qr-scanner": "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js"
      }
    }
  </script>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Сканер чеков</h5>
            <div class="text-secondary h5 mb-0" id="receiptCount"></div>
          </div>

          <div id="reader" class="ratio ratio-1x1 border rounded mb-3"
            style="overflow: hidden; position: relative; max-width: 100%; object-fit: cover;"></div>
          <div class="input-group">
            <input type="text" class="form-control" id="manualInput" placeholder="QR код чека">
            <button class="btn btn-primary" type="button" id="scanToggleBtn">
              <i class="bi bi-camera"></i>
            </button>
            <span class="vr"></span>
            <button class="btn btn-primary" type="button" id="submitBtn">
              Проверить
            </button>
          </div>
          <div id="result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="./static/script.js"></script>
</body>

</html>
