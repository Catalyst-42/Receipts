<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Receipts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/styles.css">
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "qr-scanner": "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js"
      }
    }
  </script>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card-body">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="card-title mb-0">Сканер чеков</h5>
            <div class="text-secondary h5 mb-0" id="receiptCount"></div>
          </div>

          <!-- Login status -->
          <div class="input-group mb-2">
            <span class="d-flex align-items-center px-3 border border rounded-start flex-grow-1 bg-transparent"
              id="authUserDisplay">
              <i class="bi bi-person-circle me-2"></i>
              <span id="authUsername">Гость</span>
              <span class="ms-2 text-secondary" id="authAdminBadge"
                style="display: none; font-size: 0.85em;">Администратор</span>
            </span>
            <button class="btn btn-primary" type="button" id="authActionBtn">
              Войти
            </button>
          </div>

          <!-- Camera -->
          <div id="reader" class="ratio ratio-1x1 border rounded mb-2"
            style="overflow: hidden; position: relative; max-width: 100%; object-fit: cover;"></div>

          <!-- By fiscal fields -->
          <div id="manualPanel" class="d-none mb-2">
            <input type="text" class="form-control mb-2" id="fieldT" placeholder="Дата и время" inputmode="text">
            <input type="text" class="form-control mb-2" id="fieldS" placeholder="Сумма" inputmode="decimal">
            <input type="text" class="form-control mb-2" id="fieldN" placeholder="Тип операции" inputmode="numeric">
            <input type="text" class="form-control mb-2" id="fieldFn" placeholder="ФН" inputmode="numeric">
            <input type="text" class="form-control mb-2" id="fieldI" placeholder="ФД" inputmode="numeric">
            <input type="text" class="form-control mb-2" id="fieldFp" placeholder="ФП" inputmode="numeric">
          </div>

          <div class="input-group mb-2">
            <input type="text" class="form-control" id="manualInput" placeholder="QR код чека">
            <button class="btn btn-primary" type="button" id="modeToggleBtn" title="Переключить режим">
              <i class="bi bi-pencil" id="modeToggleIcon"></i>
            </button>
            <button class="btn btn-primary" type="button" id="actionBtn">Старт</button>
          </div>

          <div id="result"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <ul class="nav nav-pills" id="authModeTabs">
            <li class="nav-item">
              <button type="button" class="nav-link active" id="authModeLoginTab" data-mode="login">Вход</button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" id="authModeRegisterTab" data-mode="register">Регистрация</button>
            </li>
          </ul>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="authForm" novalidate>
            <div class="mb-2">
              <label for="authUsernameInput" class="form-label">Имя пользователя</label>
              <input type="text" class="form-control" id="authUsernameInput" required>
              <div class="invalid-feedback" id="authUsernameFeedback"></div>
              <div class="valid-feedback" id="authUsernameSuccess"></div>
            </div>
            <div class="mb-2">
              <label for="authPassword" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="authPassword" required>
              <div class="invalid-feedback" id="authPasswordFeedback"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="submit" form="authForm" class="btn btn-primary w-100" id="authSubmitBtn">Войти</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="./static/script.js"></script>
</body>

</html>
